<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<div class="contenedor">

    <h2>Usuarios</h2>

    <input type="number" id="buscarId" placeholder="Buscar ID">

    <button onclick="buscarPorId()">Buscar</button>

    <select id="buscarEstado">
        <option value="">Estado</option>
        <option value="1">Activo</option>
        <option value="0">Inactivo</option>
    </select>

    <button onclick="buscarPorEstado()">Buscar Estado</button>

    <hr>

    <input type="number" id="codigo" placeholder="ID">

    <input type="text" id="user" placeholder="Usuario">

    <input type="password" id="pass" placeholder="Contraseña">

    <input type="email" id="email" placeholder="Correo">

    <input type="text" id="rol" placeholder="Rol">

    <select id="estado">
        <option value="1">Activo</option>
        <option value="0">Inactivo</option>
    </select>

    <br>

    <button onclick="guardar()">Guardar</button>

    <button onclick="actualizar()">Actualizar</button>

    <button onclick="eliminar()">Eliminar</button>

    <button onclick="cargar()">Refrescar</button>

    <a href="/menu">Regresar</a>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
        </tr>
        </thead>

        <tbody id="tabla"></tbody>

    </table>

</div>

<script>

    const API = "/usuarios";

    function cargar(){

        fetch(API)
            .then(r => r.json())
            .then(data => dibujar(data));
    }

    function dibujar(data){

        let tabla = document.getElementById("tabla");

        tabla.innerHTML = "";

        data.forEach(u => {

            tabla.innerHTML += `
            <tr onclick="seleccionar(${u.codigoUsuario},'${u.username}','${u.password}','${u.email}','${u.rol}','${u.estado}')">

                <td>${u.codigoUsuario}</td>

                <td>${u.username}</td>

                <td>${u.email}</td>

                <td>${u.rol}</td>

                <td>${u.estado}</td>

            </tr>
        `;
        });
    }

    function seleccionar(c,u,p,e,r,es){

        document.getElementById("codigo").value = c;

        document.getElementById("user").value = u;

        document.getElementById("pass").value = p;

        document.getElementById("email").value = e;

        document.getElementById("rol").value = r;

        document.getElementById("estado").value = es;
    }

    function obtener(){

        return{

            codigoUsuario: document.getElementById("codigo").value,

            username: document.getElementById("user").value,

            password: document.getElementById("pass").value,

            email: document.getElementById("email").value,

            rol: document.getElementById("rol").value,

            estado: document.getElementById("estado").value
        };
    }

    function guardar(){

        fetch(API,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(obtener())

        }).then(() => cargar());
    }

    function actualizar(){

        const id = document.getElementById("codigo").value;

        fetch(`${API}/${id}`,{

            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(obtener())

        }).then(() => cargar());
    }

    function eliminar(){

        const id = document.getElementById("codigo").value;

        fetch(`${API}/${id}`,{
            method:"DELETE"
        }).then(() => cargar());
    }

    function buscarPorId(){

        const id = document.getElementById("buscarId").value;

        fetch(`${API}/${id}`)
            .then(r => r.json())
            .then(data => dibujar([data]));
    }

    function buscarPorEstado(){

        const estado = document.getElementById("buscarEstado").value;

        fetch(`${API}/estado/${estado}`)
            .then(r => r.json())
            .then(data => dibujar(data));
    }

    cargar();

</script>

</body>
</html>
