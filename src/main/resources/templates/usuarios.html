<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container bg-white p-4 shadow-sm rounded">
    <h2 class="mb-4 text-primary">Mantenimiento de Usuarios</h2>

    <div class="row g-2 mb-4 p-3 border rounded bg-light">
        <div class="col-md-4"><input type="number" id="searchId" class="form-control" placeholder="ID de usuario..."></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="buscarPorId()">Buscar ID</button></div>
        <div class="col-md-3">
            <select id="searchEstado" class="form-select">
                <option value="">Estado...</option>
                <option value="1">1 - Activo</option>
                <option value="0">0 - Inactivo</option>
            </select>
        </div>
        <div class="col-md-3"><button class="btn btn-info w-100 text-white" onclick="buscarPorEstado()">Filtrar</button></div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-2"><input type="number" id="codigo" placeholder="ID" class="form-control"></div>
        <div class="col-md-3"><input type="text" id="user" placeholder="Username" class="form-control"></div>
        <div class="col-md-3"><input type="password" id="pass" placeholder="Password" class="form-control"></div>
        <div class="col-md-2"><input type="text" id="rol" placeholder="Rol" class="form-control"></div>
        <div class="col-md-2">
            <select id="estado" class="form-select">
                <option value="1">1 - Activo</option>
                <option value="0">0 - Inactivo</option>
            </select>
        </div>
        <div class="col-md-12 mt-2"><input type="email" id="email" placeholder="Correo Electrónico" class="form-control"></div>
    </div>

    <div class="mb-4">
        <button onclick="guardar()" class="btn btn-success">Guardar</button>
        <button onclick="actualizar()" class="btn btn-warning">Actualizar</button>
        <button onclick="eliminar()" class="btn btn-danger">Eliminar</button>
        <button onclick="cargar()" class="btn btn-secondary">Ver Todos</button>
        <a href="/menu" class="btn btn-dark">Regresar</a>
    </div>

    <table class="table table-hover table-bordered">
        <thead class="table-dark">
        <tr><th>ID</th><th>Username</th><th>Email</th><th>Rol</th><th>Estado</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
    const API = "/api/usuarios";
    function cargar() { fetch(API).then(r => r.json()).then(data => dibujar(data)); }
    function buscarPorId() {
        const id = document.getElementById("searchId").value;
        fetch(`${API}/${id}`).then(r => r.ok ? r.json() : null).then(d => d ? dibujar([d]) : alert("No encontrado"));
    }
    function buscarPorEstado() {
        const est = document.getElementById("searchEstado").value;
        fetch(`${API}/estado/${est}`).then(r => r.json()).then(data => dibujar(data));
    }
    function dibujar(data) {
        let tabla = document.getElementById("tabla");
        tabla.innerHTML = "";
        data.forEach(u => {
            tabla.innerHTML += `<tr onclick="seleccionar(${u.codigoUsuario},'${u.username}','${u.password}','${u.email}','${u.rol}',${u.estado})" style="cursor:pointer">
                <td>${u.codigoUsuario}</td><td>${u.username}</td><td>${u.email}</td><td>${u.rol}</td>
                <td><span class="badge ${u.estado==1?'bg-success':'bg-danger'}">${u.estado}</span></td></tr>`;
        });
    }
    function seleccionar(c, u, p, em, r, e) {
        document.getElementById("codigo").value = c; document.getElementById("user").value = u;
        document.getElementById("pass").value = p; document.getElementById("email").value = em;
        document.getElementById("rol").value = r; document.getElementById("estado").value = e;
    }
    function obtenerJson() {
        return { codigoUsuario: document.getElementById("codigo").value, username: document.getElementById("user").value,
                 password: document.getElementById("pass").value, email: document.getElementById("email").value,
                 rol: document.getElementById("rol").value, estado: document.getElementById("estado").value };
    }
    function guardar() { fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(obtenerJson())}).then(() => cargar()); }
    function actualizar() { fetch(`${API}/${document.getElementById("codigo").value}`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(obtenerJson())}).then(() => cargar()); }
    function eliminar() { fetch(`${API}/${document.getElementById("codigo").value}`, {method:"DELETE"}).then(() => cargar()); }
    cargar();
</script>
</body>
</html>
