<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/menu.css}">
</head>
<body>
<div class="menu">
    <h2>KinalApp</h2>
    <a href="/menu">
        <i class="fa fa-home"></i> Inicio
    </a>
    <a href="/clientes-vista">
        <i class="fa fa-users"></i> Clientes
    </a>
    <a href="/productos-vista">
        <i class="fa fa-box"></i> Productos
    </a>
    <a href="/usuarios-vista">
        <i class="fa fa-user"></i> Usuarios
    </a>
    <a href="/ventas-vista">
        <i class="fa fa-shopping-cart"></i> Ventas
    </a>
    <a href="/detalleventas-vista">
        <i class="fa fa-file"></i> Detalle Venta
    </a>
</div>
<div class="contenido">
    <h1>Entidades</h1>
    <div class="row">

        <div class="col-md-4">
            <div class="tarjeta azul">
                <h3>Clientes</h3>
                <p>Administrar clientes</p>
                <a href="/clientes-vista" class="btn btn-light">
                    Entrar
                </a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="tarjeta verde">
                <h3>Productos</h3>
                <p>Administrar productos</p>
                <a href="/productos-vista" class="btn btn-light">
                    Entrar
                </a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="tarjeta naranja">
                <h3>Usuarios</h3>
                <p>Administrar usuarios</p>
                <a href="/usuarios-vista" class="btn btn-light">
                    Entrar
                </a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="tarjeta rojo">
                <h3>Ventas</h3>
                <p>Administrar ventas</p>
                <a href="/ventas-vista" class="btn btn-light">
                    Entrar
                </a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="tarjeta morado">
                <h3>Detalle Venta</h3>
                <p>Ver detalles</p>
                <a href="/detalleventas-vista" class="btn btn-light">
                    Entrar
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
