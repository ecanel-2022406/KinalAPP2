    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>KinalApp | Dashboard</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

        <link rel="stylesheet" th:href="@{/menu.css}">
    </head>
    <body>

    <div class="sidebar">
        <h2>KinalApp</h2>

        <a href="/menu"><i class="fa fa-home"></i> Inicio</a>
        <a href="/clientes-vista"><i class="fa fa-users"></i> Clientes</a>
        <a href="/productos-vista"><i class="fa fa-box"></i> Productos</a>
        <a href="/usuarios-vista"><i class="fa fa-user"></i> Usuarios</a>
        <a href="/ventas-vista"><i class="fa fa-shopping-cart"></i> Ventas</a>
        <a href="/detalleventas-vista"><i class="fa fa-file"></i> Detalle Venta</a>
    </div>

    <div class="content">

        <h2 class="mb-4">Entidades</h2>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card-box clientes">
                    <i class="fa fa-users fa-2x"></i>
                    <h4>Clientes</h4>
                    <p>Gestionar clientes</p>
                    <a href="/clientes-vista" class="btn btn-light btn-sm">Entrar</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box productos">
                    <i class="fa fa-box fa-2x"></i>
                    <h4>Productos</h4>
                    <p>Gestionar productos</p>
                    <a href="/productos-vista" class="btn btn-light btn-sm">Entrar</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box usuarios">
                    <i class="fa fa-user fa-2x"></i>
                    <h4>Usuarios</h4>
                    <p>Gestionar usuarios</p>
                    <a href="/usuarios-vista" class="btn btn-light btn-sm">Entrar</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box ventas">
                    <i class="fa fa-shopping-cart fa-2x"></i>
                    <h4>Ventas</h4>
                    <p>Gestionar ventas</p>
                    <a href="/ventas-vista" class="btn btn-light btn-sm">Entrar</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box detalle">
                    <i class="fa fa-file fa-2x"></i>
                    <h4>Detalle Venta</h4>
                    <p>Ver detalles</p>
                    <a href="/detalleventas-vista" class="btn btn-light btn-sm">Entrar</a>
                </div>
            </div>

        </div>

    </div>

    </body>
    </html>
