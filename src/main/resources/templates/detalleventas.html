<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Detalle de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 bg-light">

<div class="container bg-white p-4 shadow rounded">
    <h2 class="text-primary mb-4">Detalle de Venta</h2>

    <!-- FORMULARIO -->
    <div class="row g-3 mb-4">
        <div class="col-md-2">
            <label class="form-label">ID Detalle</label>
            <input type="number" id="codigo" class="form-control" disabled>
        </div>

        <div class="col-md-2">
            <label class="form-label">ID Venta</label>
            <input type="number" id="idVenta" class="form-control">
        </div>

        <div class="col-md-2">
            <label class="form-label">ID Producto</label>
            <input type="number" id="idProd" class="form-control">
        </div>

        <div class="col-md-2">
            <label class="form-label">Cantidad</label>
            <input type="number" id="cantidad" class="form-control" oninput="calcular()">
        </div>

        <div class="col-md-2">
            <label class="form-label">Precio Unitario</label>
            <input type="number" step="0.01" id="precio" class="form-control" oninput="calcular()">
        </div>

        <div class="col-md-2">
            <label class="form-label">Subtotal</label>
            <input type="number" id="subtotal" class="form-control" readonly>
        </div>
    </div>

    <!-- BOTONES -->
    <div class="mb-4">
        <button class="btn btn-success me-2" onclick="guardar()">Guardar</button>
        <button class="btn btn-secondary" onclick="cargar()">Refrescar</button>
        <a href="/menu" class="btn btn-dark">Regresar</a>
    </div>

    <!-- TABLA -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Venta</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
    const API = "/detalleventas";

    function calcular() {
        const c = Number(document.getElementById("cantidad").value || 0);
        const p = Number(document.getElementById("precio").value || 0);
        document.getElementById("subtotal").value = (c * p).toFixed(2);
    }

    function cargar() {
        fetch(API)
            .then(r => r.json())
            .then(data => {
                const t = document.getElementById("tabla");
                t.innerHTML = "";
                data.forEach(d => {
                    t.innerHTML += `
                    <tr>
                        <td>${d.codigoDetalleVenta}</td>
                        <td>${d.venta.codigoVenta}</td>
                        <td>${d.producto.codigoProducto}</td>
                        <td>${d.cantidad}</td>
                        <td>Q${d.precioUnitario}</td>
                        <td>Q${d.subtotal}</td>
                    </tr>`;
                });
            });
    }

    function guardar() {

        const detalle = {
            cantidad: Number(document.getElementById("cantidad").value),
            precioUnitario: Number(document.getElementById("precio").value),
            venta: {
                codigoVenta: Number(document.getElementById("idVenta").value)
            },
            producto: {
                codigoProducto: Number(document.getElementById("idProd").value)
            }
        };

        fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(detalle)
        })
        .then(r => {
            if (!r.ok) return r.text().then(t => { throw t });
            return r.json();
        })
        .then(() => {
            alert("Detalle guardado correctamente");
            limpiar();
            cargar();
        })
        .catch(err => alert("Error del servidor: " + err));
    }

    function limpiar() {
        document.getElementById("cantidad").value = "";
        document.getElementById("precio").value = "";
        document.getElementById("subtotal").value = "";
    }

    cargar();
</script>

</body>
</html>
