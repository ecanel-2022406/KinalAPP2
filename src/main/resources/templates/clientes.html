<!-- CLIENTES -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<div class="contenedor">

    <h2>Clientes</h2>

    <input type="text" id="buscarDpi" placeholder="Buscar DPI">
    <button onclick="buscarPorDpi()">Buscar</button>

    <select id="buscarEstado">
        <option value="">Estado</option>
        <option value="1">Activo</option>
        <option value="0">Inactivo</option>
    </select>

    <button onclick="buscarPorEstado()">Buscar Estado</button>

    <hr>

    <input type="text" id="dpi" placeholder="DPI">
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="text" id="apellido" placeholder="Apellido">
    <input type="text" id="direccion" placeholder="Dirección">

    <select id="estado">
        <option value="1">Activo</option>
        <option value="0">Inactivo</option>
    </select>

    <br>

    <button onclick="guardar()">Guardar</button>
    <button onclick="actualizar()">Actualizar</button>
    <button onclick="eliminar()">Eliminar</button>
    <button onclick="cargar()">Refrescar</button>

    <a href="/menu">Regresar</a>

    <table>

        <thead>
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
        </tr>
        </thead>

        <tbody id="tabla"></tbody>

    </table>

</div>

<script>

    const API = "/api/clientes";

    function cargar(){

        fetch(API)
            .then(r => r.json())
            .then(data => dibujar(data));
    }

    function dibujar(data){

        let tabla = document.getElementById("tabla");

        tabla.innerHTML = "";

        data.forEach(c => {

            tabla.innerHTML += `
            <tr onclick="seleccionar('${c.dpiCliente}','${c.nombreCliente}','${c.apellidoCliente}','${c.direccion}','${c.estado}')">

                <td>${c.dpiCliente}</td>

                <td>${c.nombreCliente}</td>

                <td>${c.apellidoCliente}</td>

                <td>${c.direccion}</td>

                <td>${c.estado}</td>

            </tr>
        `;
        });
    }

    function seleccionar(d,n,a,dir,e){

        document.getElementById("dpi").value = d;

        document.getElementById("nombre").value = n;

        document.getElementById("apellido").value = a;

        document.getElementById("direccion").value = dir;

        document.getElementById("estado").value = e;
    }

    function obtener(){

        return{

            dpiCliente: document.getElementById("dpi").value,

            nombreCliente: document.getElementById("nombre").value,

            apellidoCliente: document.getElementById("apellido").value,

            direccion: document.getElementById("direccion").value,

            estado: document.getElementById("estado").value
        };
    }

    function guardar(){

        fetch(API,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(obtener())

        }).then(() => cargar());
    }

    function actualizar(){

        const dpi = document.getElementById("dpi").value;

        fetch(`${API}/${dpi}`,{

            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(obtener())

        }).then(() => cargar());
    }

    function eliminar(){

        const dpi = document.getElementById("dpi").value;

        fetch(`${API}/${dpi}`,{
            method:"DELETE"
        }).then(() => cargar());
    }

    function buscarPorDpi(){

        const dpi = document.getElementById("buscarDpi").value;

        fetch(`${API}/${dpi}`)
            .then(r => r.json())
            .then(data => dibujar([data]));
    }

    function buscarPorEstado(){

        const estado = document.getElementById("buscarEstado").value;

        fetch(`${API}/estado/${estado}`)
            .then(r => r.json())
            .then(data => dibujar(data));
    }

    cargar();

</script>

</body>
</html>
