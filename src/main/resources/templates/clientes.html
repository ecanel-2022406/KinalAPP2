<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container bg-white p-4 shadow-sm rounded">
    <h2 class="mb-4 text-primary">Gestión de Clientes</h2>

    <div class="row g-2 mb-4 p-3 border rounded bg-light">
        <div class="col-md-4">
            <input type="text" id="searchDpi" class="form-control" placeholder="DPI a buscar...">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" onclick="buscarPorDpi()">Buscar DPI</button>
        </div>
        <div class="col-md-3">
            <select id="searchEstado" class="form-select">
                <option value="">Filtrar por Estado...</option>
                <option value="1">1 - Activo</option>
                <option value="0">0 - Inactivo</option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-info w-100 text-white" onclick="buscarPorEstado()">Filtrar Estado</button>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-2"><input type="text" id="dpi" placeholder="DPI" class="form-control"></div>
        <div class="col-md-3"><input type="text" id="nombre" placeholder="Nombre" class="form-control"></div>
        <div class="col-md-3"><input type="text" id="apellido" placeholder="Apellido" class="form-control"></div>
        <div class="col-md-2"><input type="text" id="direccion" placeholder="Dirección" class="form-control"></div>
        <div class="col-md-2">
            <select id="estado" class="form-select">
                <option value="1">1 - Activo</option>
                <option value="0">0 - Inactivo</option>
            </select>
        </div>
    </div>

    <div class="mb-4">
        <button onclick="guardar()" class="btn btn-success">Guardar</button>
        <button onclick="actualizar()" class="btn btn-warning">Actualizar</button>
        <button onclick="eliminar()" class="btn btn-danger">Eliminar</button>
        <button onclick="cargar()" class="btn btn-secondary">Limpiar/Ver Todos</button>
        <a href="/menu" class="btn btn-dark">Regresar al Menú</a>
    </div>

    <table class="table table-hover table-bordered">
        <thead class="table-dark">
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
    const API = "/api/clientes";

    function cargar() {
        fetch(API).then(r => r.json()).then(data => dibujarTabla(data));
    }

    function buscarPorDpi() {
        const val = document.getElementById("searchDpi").value;
        if (!val) return alert("Ingrese un DPI");
        fetch(`${API}/${val}`)
            .then(r => r.ok ? r.json() : null)
            .then(data => data ? dibujarTabla([data]) : alert("No se encontró el DPI"));
    }

    function buscarPorEstado() {
        const est = document.getElementById("searchEstado").value;
        if (est === "") return alert("Seleccione un estado");
        fetch(`${API}/estado/${est}`)
            .then(r => r.json())
            .then(data => dibujarTabla(data));
    }

    function dibujarTabla(data) {
        let tabla = document.getElementById("tabla");
        tabla.innerHTML = "";
        data.forEach(c => {
            tabla.innerHTML += `
                <tr onclick="seleccionar('${c.dpiCliente}','${c.nombreCliente}','${c.apellidoCliente}','${c.direccion}',${c.estado})" style="cursor:pointer">
                    <td>${c.dpiCliente}</td>
                    <td>${c.nombreCliente}</td>
                    <td>${c.apellidoCliente}</td>
                    <td>${c.direccion}</td>
                    <td><span class="badge ${c.estado == 1 ? 'bg-success' : 'bg-danger'}">${c.estado}</span></td>
                </tr>`;
        });
    }

    function seleccionar(d, n, a, dir, est) {
        document.getElementById("dpi").value = d;
        document.getElementById("nombre").value = n;
        document.getElementById("apellido").value = a;
        document.getElementById("direccion").value = dir;
        document.getElementById("estado").value = est;
    }

    function guardar() {
        fetch(API, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(obtenerJson())
        }).then(() => cargar());
    }

    function actualizar() {
        const dpi = document.getElementById("dpi").value;
        fetch(`${API}/${dpi}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(obtenerJson())
        }).then(() => cargar());
    }

    function eliminar() {
        const dpi = document.getElementById("dpi").value;
        if (confirm("¿Eliminar registro?")) {
            fetch(`${API}/${dpi}`, { method: "DELETE" }).then(() => cargar());
        }
    }

    function obtenerJson() {
        return {
            dpiCliente: document.getElementById("dpi").value,
            nombreCliente: document.getElementById("nombre").value,
            apellidoCliente: document.getElementById("apellido").value,
            direccion: document.getElementById("direccion").value,
            estado: document.getElementById("estado").value
        };
    }

    cargar();
</script>
</body>
</html>
