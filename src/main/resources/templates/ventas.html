<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

<div class="container bg-white p-4 shadow-sm rounded">
    <h2 class="mb-4 text-primary">Gestión de Ventas</h2>

    <div class="row g-2 mb-3">
        <div class="col-md-2">
            <input type="number" id="codigo" class="form-control" placeholder="ID Venta" disabled>
        </div>

        <div class="col-md-3">
            <input type="date" id="fecha" class="form-control">
        </div>

        <div class="col-md-3">
            <select id="cliente" class="form-select"></select>
        </div>

        <div class="col-md-2">
            <select id="usuario" class="form-select"></select>
        </div>

        <div class="col-md-2">
            <input type="number" id="total" class="form-control" placeholder="Total Q" step="0.01" min="0">
        </div>
    </div>

    <div class="row g-2 mb-4">
        <div class="col-md-2">
            <select id="estado" class="form-select">
                <option value="1">1 - Activa</option>
                <option value="0">0 - Inactiva</option>
            </select>
        </div>
    </div>

    <div class="mb-4">
        <button onclick="guardar()" class="btn btn-success">Guardar</button>
        <button onclick="cargar()" class="btn btn-secondary">Limpiar / Ver Todos</button>
        <a href="/menu" class="btn btn-dark">Regresar</a>
    </div>

    <table class="table table-hover table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Usuario</th>
            <th>Total</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
    const API_VENTAS = "/ventas";
    const API_CLIENTES = "/api/clientes";
    const API_USUARIOS = "/usuarios";

    function cargar() {
        fetch(API_VENTAS)
            .then(r => r.json())
            .then(data => dibujarTabla(data));
    }

    function cargarClientes() {
        fetch(API_CLIENTES)
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById("cliente");
                select.innerHTML = "";
                data.forEach(c => {
                    select.innerHTML += `
                        <option value="${c.dpiCliente}">
                            ${c.dpiCliente} - ${c.nombreCliente} ${c.apellidoCliente}
                        </option>`;
                });
            });
    }

    function cargarUsuarios() {
        fetch(API_USUARIOS)
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById("usuario");
                select.innerHTML = "";
                data.forEach(u => {
                    select.innerHTML += `
                        <option value="${u.codigoUsuario}">
                            ${u.codigoUsuario} - ${u.username}
                        </option>`;
                });
            });
    }

    function dibujarTabla(data) {
        const tabla = document.getElementById("tabla");
        tabla.innerHTML = "";
        data.forEach(v => {
            tabla.innerHTML += `
                <tr>
                    <td>${v.codigoVenta}</td>
                    <td>${v.fechaVenta}</td>
                    <td>${v.cliente.dpiCliente}</td>
                    <td>${v.usuario.codigoUsuario}</td>
                    <td>Q${Number(v.total).toFixed(2)}</td>
                    <td>
                        <span class="badge ${v.estado == 1 ? 'bg-success' : 'bg-danger'}">
                            ${v.estado}
                        </span>
                    </td>
                </tr>`;
        });
    }

    function guardar() {
        const venta = {
            fechaVenta: document.getElementById("fecha").value,
            total: document.getElementById("total").value,
            estado: document.getElementById("estado").value,
            cliente: {
                dpiCliente: document.getElementById("cliente").value
            },
            usuario: {
                codigoUsuario: document.getElementById("usuario").value
            }
        };

        fetch(API_VENTAS, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(venta)
        })
        .then(() => {
            limpiar();
            cargar();
        });
    }

    function limpiar() {
        document.getElementById("fecha").value = "";
        document.getElementById("total").value = "";
        document.getElementById("estado").value = 1;
    }

    cargar();
    cargarClientes();
    cargarUsuarios();
</script>

</body>
</html>
