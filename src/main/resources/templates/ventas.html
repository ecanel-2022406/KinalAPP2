<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container bg-white p-4 shadow-sm rounded">
    <h2 class="mb-4 text-primary">Registro de Ventas</h2>

    <div class="row g-2 mb-4 p-3 border rounded bg-light">
        <div class="col-md-4"><input type="number" id="searchId" class="form-control" placeholder="No. Venta..."></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="buscarPorId()">Buscar</button></div>
        <div class="col-md-3">
            <select id="searchEstado" class="form-select">
                <option value="">Estado...</option>
                <option value="1">1 - Pagada</option>
                <option value="0">0 - Cancelada</option>
            </select>
        </div>
        <div class="col-md-3"><button class="btn btn-info w-100 text-white" onclick="buscarPorEstado()">Filtrar</button></div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-2"><input type="number" id="codigo" placeholder="No. Venta" class="form-control"></div>
        <div class="col-md-3"><input type="date" id="fecha" class="form-control"></div>
        <div class="col-md-3"><input type="text" id="dpi" placeholder="DPI Cliente" class="form-control"></div>
        <div class="col-md-2"><input type="number" id="uCod" placeholder="Cod. Usuario" class="form-control"></div>
        <div class="col-md-2">
            <select id="estado" class="form-select">
                <option value="1">1 - Activo</option>
                <option value="0">0 - Inactivo</option>
            </select>
        </div>
        <div class="col-md-12 mt-2"><input type="number" id="total" placeholder="Total (Calculado)" class="form-control" readonly></div>
    </div>

    <div class="mb-4">
        <button onclick="guardar()" class="btn btn-success">Guardar</button>
        <button onclick="actualizar()" class="btn btn-warning">Actualizar</button>
        <button onclick="eliminar()" class="btn btn-danger">Eliminar</button>
        <button onclick="cargar()" class="btn btn-secondary">Ver Todas</button>
        <a href="/menu" class="btn btn-dark">Regresar</a>
    </div>

    <table class="table table-hover table-bordered">
        <thead class="table-dark">
        <tr><th>No. Venta</th><th>Fecha</th><th>DPI Cliente</th><th>Usuario</th><th>Total</th><th>Estado</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
    const API = "/api/ventas";
    function cargar() { fetch(API).then(r => r.json()).then(data => dibujar(data)); }
    function buscarPorId() {
        const id = document.getElementById("searchId").value;
        fetch(`${API}/${id}`).then(r => r.ok ? r.json() : null).then(d => d ? dibujar([d]) : alert("No encontrada"));
    }
    function buscarPorEstado() {
        const est = document.getElementById("searchEstado").value;
        fetch(`${API}/estado/${est}`).then(r => r.json()).then(data => dibujar(data));
    }
    function dibujar(data) {
        let tabla = document.getElementById("tabla");
        tabla.innerHTML = "";
        data.forEach(v => {
            tabla.innerHTML += `<tr onclick="seleccionar(${v.codigoVenta},'${v.fechaVenta}','${v.cliente.dpiCliente}',${v.usuario.codigoUsuario},${v.total},${v.estado})" style="cursor:pointer">
                <td>${v.codigoVenta}</td><td>${v.fechaVenta}</td><td>${v.cliente.dpiCliente}</td><td>${v.usuario.codigoUsuario}</td><td>Q${v.total}</td>
                <td><span class="badge ${v.estado==1?'bg-success':'bg-danger'}">${v.estado}</span></td></tr>`;
        });
    }
    function seleccionar(c, f, d, u, t, e) {
        document.getElementById("codigo").value = c; document.getElementById("fecha").value = f;
        document.getElementById("dpi").value = d; document.getElementById("uCod").value = u;
        document.getElementById("total").value = t; document.getElementById("estado").value = e;
    }
    function obtenerJson() {
        return { codigoVenta: document.getElementById("codigo").value, fechaVenta: document.getElementById("fecha").value,
                 total: document.getElementById("total").value || 0, estado: document.getElementById("estado").value,
                 cliente: { dpiCliente: document.getElementById("dpi").value },
                 usuario: { codigoUsuario: document.getElementById("uCod").value } };
    }
    function guardar() { fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(obtenerJson())}).then(() => cargar()); }
    function actualizar() { fetch(`${API}/${document.getElementById("codigo").value}`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(obtenerJson())}).then(() => cargar()); }
    function eliminar() { fetch(`${API}/${document.getElementById("codigo").value}`, {method:"DELETE"}).then(() => cargar()); }
    cargar();
</script>
</body>
</html>
