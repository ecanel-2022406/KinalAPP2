<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Gestión de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

<div class="container bg-white p-4 shadow rounded">
    <h2 class="mb-4 text-primary">Gestión de Ventas</h2>

    <!-- FORMULARIO -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <label class="form-label">Fecha</label>
            <input type="date" id="fecha" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">DPI Cliente</label>
            <input type="text" id="cliente" class="form-control" placeholder="Ingrese DPI">
        </div>

        <div class="col-md-3">
            <label class="form-label">ID Usuario</label>
            <input type="number" id="usuario" class="form-control" placeholder="Código usuario">
        </div>

        <div class="col-md-3">
            <label class="form-label">Estado</label>
            <select id="estado" class="form-select">
                <option value="1">Activa</option>
                <option value="0">Inactiva</option>
            </select>
        </div>
    </div>

    <!-- BOTONES -->
    <div class="mb-4">
        <button class="btn btn-success me-2" onclick="guardar()">Guardar</button>
        <button class="btn btn-secondary" onclick="cargar()">Refrescar</button>
        <a href="/menu" class="btn btn-dark ms-2">Regresar</a>
    </div>

    <!-- TABLA -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Usuario</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
</div>

<script>
    const API = "/ventas";

    /* ---------------- LISTAR ---------------- */
    function cargar() {
        fetch(API)
            .then(r => r.json())
            .then(data => {
                const tabla = document.getElementById("tabla");
                tabla.innerHTML = "";
                data.forEach(v => {
                    tabla.innerHTML += `
                        <tr>
                            <td>${v.codigoVenta}</td>
                            <td>${v.fechaVenta}</td>
                            <td>${v.cliente?.dpiCliente ?? ""}</td>
                            <td>${v.usuario?.codigoUsuario ?? ""}</td>
                            <td>
                                <span class="badge ${v.estado == 1 ? 'bg-success' : 'bg-danger'}">
                                    ${v.estado}
                                </span>
                            </td>
                        </tr>`;
                });
            });
    }

    /* ---------------- GUARDAR ---------------- */
    function guardar() {
        const venta = {
            fechaVenta: document.getElementById("fecha").value,
            estado: Number(document.getElementById("estado").value),
            cliente: {
                dpiCliente: document.getElementById("cliente").value
            },
            usuario: {
                codigoUsuario: Number(document.getElementById("usuario").value)
            }
        };

        fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(venta)
        })
        .then(r => {
            if (!r.ok) return r.text().then(t => { throw t });
            return r.json();
        })
        .then(() => {
            alert("Venta guardada correctamente");
            limpiar();
            cargar();
        })
        .catch(err => alert("Error del servidor: " + err));
    }

    /* ---------------- LIMPIAR ---------------- */
    function limpiar() {
        document.getElementById("fecha").value = "";
        document.getElementById("cliente").value = "";
        document.getElementById("usuario").value = "";
        document.getElementById("estado").value = "1";
    }

    cargar();
</script>

</body>
</html>
